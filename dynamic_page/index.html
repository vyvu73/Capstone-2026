<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Speed Test</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D2542C'/%3E%3Crect x='9' y='8' width='3' height='16' rx='1.5' fill='%23FFFCF7'/%3E%3Crect x='16' y='8' width='7' height='3' rx='1.5' fill='%23FFFCF7'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#17130F',
              'ink-soft': '#4A3F36',
              paper: '#F7F2EA',
              'paper-raised': '#FFFCF7',
              ember: '#D2542C',
              'ember-deep': '#A83A18',
              'ember-soft': '#F3C4B1',
              clay: '#8A7A6B',
              'clay-faint': '#D9CEC1',
            },
            fontFamily: {
              display: ['"Instrument Serif"', 'Georgia', 'serif'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            boxShadow: {
              // Layered and slightly orange-tinted, rather than a flat grey.
              float:
                '0 2px 4px rgba(23, 19, 15, 0.06), 0 10px 24px -6px rgba(168, 58, 24, 0.16), 0 32px 64px -24px rgba(23, 19, 15, 0.30)',
            },
          },
        },
      };
    </script>

    <style>
      :root {
        color-scheme: light;
      }

      body {
        background-color: #f7f2ea;
        /* One soft wash at the top, so the page does not look completely flat. */
        background-image: radial-gradient(
          900px 460px at 50% -10%,
          rgba(210, 84, 44, 0.09),
          transparent 65%
        );
        background-attachment: fixed;
      }

      /* Turn off the button fades for anyone who asked their computer for
         less motion. */
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body class="font-sans text-ink antialiased">
    <div id="root" class="relative z-10"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
